<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Gold Scalper - Safety Net</title>
    <style>
        :root { 
            --bg: #0d1117; --card: #161b22; --border: #30363d; 
            --text: #c9d1d9; --muted: #8b949e; --gold: #f2ca30; 
            --alert: #f85149; --go: #238636;
        }
        body { 
            background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; 
        }
        .terminal { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            width: 100%; max-width: 440px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        .badge { 
            display: block; text-align: center; padding: 10px; border-radius: 8px; 
            font-size: 0.9rem; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; 
        }
        .wait { background: rgba(242, 202, 48, 0.15); color: var(--gold); border: 1px solid rgba(242,202,48,0.3); }
        .window { background: rgba(35, 134, 54, 0.2); color: #58a6ff; border: 1px solid #58a6ff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .timer-display {
            text-align: center; font-size: 3rem; font-weight: 800; font-family: monospace; margin: 10px 0 20px 0; color: #fff;
        }
        .row { display: flex; flex-direction: column; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; padding: 10px 12px; }
        .lbl { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; font-weight: 600; }
        .inp { 
            width: 100%; background: none; border: none; color: #fff; text-align: right; 
            font-size: 1.4rem; font-weight: 700; font-family: monospace; box-sizing: border-box; outline: none;
        }
        .signal-box {
            text-align: center; padding: 15px; border-radius: 8px; font-size: 1.5rem; font-weight: 800; margin-top: 15px;
            background: #21262d; border: 1px solid var(--border); color: var(--muted);
        }
        .signal-yes { background: rgba(35, 134, 54, 0.25); border: 2px solid var(--go); color: #56d364; }
        .signal-no { background: rgba(248, 81, 73, 0.25); border: 2px solid var(--alert); color: #ff7b72; }
    </style>
</head>
<body>

<div class="terminal">
    <div id="status-badge" class="badge wait">Waiting for Window</div>
    
    <div class="timer-display" id="timer">15:00</div>
    
    <div class="row">
        <label class="lbl">Current Yes Price (¢)</label>
        <input class="inp" id="yes-price" type="number" min="1" max="99" value="50" oninput="evaluateStrategy()">
    </div>

    <div class="row">
        <label class="lbl">Current No Price (¢)</label>
        <input class="inp" id="no-price" type="number" min="1" max="99" value="50" oninput="evaluateStrategy()">
    </div>

    <div id="signal" class="signal-box">HOLD / NO SIGNAL</div>
</div>

<script>
    const timerEl = document.getElementById('timer');
    const badgeEl = document.getElementById('status-badge');
    const yesInp = document.getElementById('yes-price');
    const noInp = document.getElementById('no-price');
    const signalEl = document.getElementById('signal');

    let inTradingWindow = false;

    function updateTimer() {
        const now = new Date();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        
        // Calculate remaining time in the current 15-minute market cycle
        const remMin = 14 - (minutes % 15);
        const remSec = 59 - seconds;
        
        // Format strings
        const displayMin = String(remMin).padStart(2, '0');
        const displaySec = String(remSec).padStart(2, '0');
        timerEl.textContent = `${displayMin}:${displaySec}`;
        
        // Strategy constraint: Active window between 10 and 5 minutes remaining
        if (remMin >= 5 && remMin < 10) {
            inTradingWindow = true;
            badgeEl.textContent = "🚀 TRADING WINDOW OPEN";
            badgeEl.className = "badge window";
        } else {
            inTradingWindow = false;
            badgeEl.textContent = "⏳ WAITING FOR WINDOW (10M-5M)";
            badgeEl.className = "badge wait";
        }
        
        evaluateStrategy();
    }

    function evaluateStrategy() {
        if (!inTradingWindow) {
            signalEl.textContent = "HOLD (OUTSIDE TIME WINDOW)";
            signalEl.className = "signal-box";
            return;
        }

        const yesVal = parseInt(yesInp.value) || 0;
        const noVal = parseInt(noInp.value) || 0;
        const threshold = 82;

        if (yesVal >= threshold) {
            signalEl.textContent = `🎯 BUY YES CONTRACT (${yesVal}%)`;
            signalEl.className = "signal-box signal-yes";
        } else if (noVal >= threshold) {
            signalEl.textContent = `🎯 BUY NO CONTRACT (${noVal}%)`;
            signalEl.className = "signal-box signal-no";
        } else {
            signalEl.textContent = "WATCHING (UNDER 82%)";
            signalEl.className = "signal-box";
        }
    }

    // Sync input adjustments between Yes and No (since they mirror each other on Kalshi)
    yesInp.addEventListener('input', () => {
        let val = parseInt(yesInp.value);
        if (val >= 1 && val <= 99) noInp.value = 100 - val;
    });

    noInp.addEventListener('input', () => {
        let val = parseInt(noInp.value);
        if (val >= 1 && val <= 99) yesInp.value = 100 - val;
    });

    // Run clock loop
    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
