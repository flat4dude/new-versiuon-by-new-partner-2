<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Gold 15m Safety Net</title>
    <style>
        :root { 
            --bg: #090a0f; --card: #12131a; --border: #1f222e; 
            --text: #ffffff; --muted: #7e8494; --gold: #f2ca30; 
            --up: #00e699; --down: #ff3355;
        }
        body { 
            background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; 
        }
        .terminal { 
            background: var(--card); border: 1px solid var(--border); border-radius: 24px; 
            width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.7); 
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .market-title { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .token { background: var(--gold); color: #000; font-size: 0.75rem; font-weight: 900; padding: 3px 6px; border-radius: 6px; }
        .clock-badge { background: #202430; font-family: monospace; font-size: 0.95rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; }
        
        .price-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        .price-block { display: flex; flex-direction: column; }
        .price-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
        .target-val { font-size: 1rem; font-weight: 700; font-family: monospace; color: var(--gold); word-break: break-all; }
        
        .btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .trade-btn { 
            border: none; border-radius: 20px; padding: 18px; font-size: 1.2rem; font-weight: 800; 
            color: #000; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .btn-up { background: var(--up); }
        .btn-down { background: var(--down); color: #fff; }
        
        .alert-banner {
            text-align: center; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700;
            background: #1a1d29; border: 1px solid var(--border); color: var(--muted); margin-bottom: 20px;
        }
        .alert-active { background: rgba(0, 230, 153, 0.15); border-color: var(--up); color: var(--up); animation: glow 1.5s infinite; }
        .alert-active-down { background: rgba(255, 51, 85, 0.15); border-color: var(--down); color: var(--down); animation: glow 1.5s infinite; }
        @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <div class="market-title"><span class="token">GLD</span> GOLD 15 min</div>
        <div class="clock-badge" id="timer">00:00</div>
    </div>
    
    <div class="price-grid">
        <div class="price-block">
            <span class="price-label">Current Active Market Ticker</span>
            <span class="target-val" id="market-ticker">SCANNING DATA FEEDS...</span>
        </div>
    </div>

    <!-- Strategy Safety Net Alert Window -->
    <div id="safety-alert" class="alert-banner">INITIALIZING PIPELINE...</div>
    
    <div class="btn-container">
        <div class="trade-btn btn-up">
            <span id="up-prob">Up • --%</span>
        </div>
        <div class="trade-btn btn-down">
            <span id="down-prob">Down • --%</span>
        </div>
    </div>
</div>

<script>
    const alertBanner = document.getElementById('safety-alert');
    const timerEl = document.getElementById('timer');
    const tickerEl = document.getElementById('market-ticker');

    let currentYesPrice = 50;
    let currentNoPrice = 50;
    
    // Primary open proxy utility endpoint
    const proxyUrl = "https://corsproxy.io?";

    async function fetchPublicKalshiPrices() {
        try {
            // Pulls active endpoints directly using target parameter filtering strings
            const endpoint = "https://kalshi.com";
            const response = await fetch(proxyUrl + encodeURIComponent(endpoint));
            const data = await response.json();
            
            if (!data.markets || data.markets.length === 0) {
                return;
            }

            // Identifies active commodity items utilizing matching short ticker codes
            const goldMarkets = data.markets.filter(m => 
                (m.ticker.includes("GLD") || m.ticker.includes("GOLD")) && 
                (m.frequency === "fifteen_min" || m.ticker.includes("15MIN"))
            );

            if (goldMarkets.length === 0) {
                tickerEl.textContent = "WAITING FOR ROLLING WINDOW OPEN...";
                return;
            }

            // Always select the nearest chronologically closing active market contract segment
            const sortedMarkets = goldMarkets.sort((a, b) => new Date(a.close_time) - new Date(b.close_time));
            const activeMarket = sortedMarkets[0];
            const ticker = activeMarket.ticker;
            tickerEl.textContent = ticker;

            // Fetch the corresponding real-time order book probability data matrix
            const bookUrl = `https://kalshi.com{ticker}/orderbook`;
            const bookRes = await fetch(proxyUrl + encodeURIComponent(bookUrl));
            const bookData = await bookRes.json();

            if (bookData.orderbook) {
                currentYesPrice = bookData.orderbook.yes_price || 50;
                currentNoPrice = bookData.orderbook.no_price || 50;

                document.getElementById('up-prob').textContent = `Up • ${currentYesPrice}%`;
                document.getElementById('down-prob').textContent = `Down • ${currentNoPrice}%`;
            }
        } catch (err) {
            console.error("Network syncing latency gap:", err);
        }
    }

    function processSafetyNetRules() {
        const now = new Date();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        
        const remMin = 14 - (minutes % 15);
        const remSec = 59 - seconds;
        
        timerEl.textContent = `${String(remMin).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;

        if (remMin >= 5 && remMin < 10) {
            if (currentYesPrice >= 82) {
                alertBanner.textContent = `🎯 TRIGGER: BUY UP CONTRACT (${currentYesPrice}%)`;
                alertBanner.className = "alert-banner alert-active";
            } else if (currentNoPrice >= 82) {
                alertBanner.textContent = `🎯 TRIGGER: BUY DOWN CONTRACT (${currentNoPrice}%)`;
                alertBanner.className = "alert-banner alert-active-down";
            } else {
                alertBanner.textContent = "⌛ WINDOW OPEN: WATCHING FOR 82%+";
                alertBanner.className = "alert-banner";
            }
        } else {
            alertBanner.textContent = "⚠️ OUTSIDE TRADING WINDOW";
            alertBanner.className = "alert-banner";
        }
    }

    // High performance processing sync routines
    setInterval(fetchPublicKalshiPrices, 2000);
    setInterval(processSafetyNetRules, 1000);
    
    fetchPublicKalshiPrices();
</script>

</body>
</html>
