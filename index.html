<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Gold 15m Safety Net</title>
    <style>
        :root { 
            --bg: #090a0f; --card: #12131a; --border: #1f222e; 
            --text: #ffffff; --muted: #7e8494; --gold: #f2ca30; 
            --up: #00e699; --down: #ff3355;
        }
        body { 
            background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; 
        }
        .terminal { 
            background: var(--card); border: 1px solid var(--border); border-radius: 24px; 
            width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.7); 
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .market-title { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .token { background: var(--gold); color: #000; font-size: 0.75rem; font-weight: 900; padding: 3px 6px; border-radius: 6px; }
        .clock-badge { background: #202430; font-family: monospace; font-size: 0.95rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; }
        
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .price-block { display: flex; flex-direction: column; }
        .price-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
        .target-val { font-size: 1.5rem; font-weight: 700; font-family: monospace; }
        .live-val { font-size: 1.5rem; font-weight: 700; font-family: monospace; color: var(--down); }
        
        .btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .trade-btn { 
            border: none; border-radius: 20px; padding: 16px; font-size: 1.1rem; font-weight: 800; 
            color: #000; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .btn-up { background: var(--up); }
        .btn-down { background: var(--down); color: #fff; }
        .multiplier { font-size: 0.8rem; font-weight: 500; opacity: 0.8; }
        
        .alert-banner {
            text-align: center; padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: 700;
            background: #1a1d29; border: 1px solid var(--border); color: var(--muted); margin-bottom: 20px;
        }
        .alert-active { background: rgba(0, 230, 153, 0.1); border-color: var(--up); color: var(--up); animation: glow 1.5s infinite; }
        @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <div class="market-title"><span class="token">GLD</span> GOLD 15 min</div>
        <div class="clock-badge" id="timer">00:00</div>
    </div>
    
    <div class="price-grid">
        <div class="price-block">
            <span class="price-label">Target • 1:45pm</span>
            <span class="target-val">$4,414.87</span>
        </div>
        <div class="price-block" style="text-align: right;">
            <span class="price-label">Now ↑ $1.37</span>
            <span class="live-val" id="current-spot">$4,416.24</span>
        </div>
    </div>

    <!-- Strategy Safety Net Alert Window -->
    <div id="safety-alert" class="alert-banner">WAITING FOR 10M-5M WINDOW</div>
    
    <div class="btn-container">
        <button class="trade-btn btn-up">
            <span id="up-prob">Up • 60%</span>
            <span class="multiplier">1.57x</span>
        </button>
        <button class="trade-btn btn-down">
            <span id="down-prob">Down • 40%</span>
            <span class="multiplier">2.46x</span>
        </button>
    </div>
</div>

<script>
    // HARDCODED LIVE SIMULATION (Replace this chunk with your live API fetch)
    let currentUpProbability = 60; 

    function simulateLiveData() {
        // Simulating minor price and probability ticks like Kalshi order book
        const change = Math.random() > 0.5 ? 1 : -1;
        currentUpProbability = Math.max(10, Math.min(90, currentUpProbability + change));
        
        document.getElementById('up-prob').textContent = `Up • ${currentUpProbability}%`;
        document.getElementById('down-prob').textContent = `Down • ${100 - currentUpProbability}%`;
        
        checkSafetyStrategy();
    }

    function checkSafetyStrategy() {
        const now = new Date();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        
        const remMin = 14 - (minutes % 15);
        const remSec = 59 - seconds;
        
        document.getElementById('timer').textContent = `${String(remMin).padStart(2, '0')}:${String(remSec).padStart(2, '0')}`;
        const alertBanner = document.getElementById('safety-alert');

        // Check if inside the 10 to 5 minutes remaining window
        if (remMin >= 5 && remMin < 10) {
            if (currentUpProbability >= 82) {
                alertBanner.textContent = "🎯 TRIGGER: BUY UP CONTRACT!";
                alertBanner.className = "alert-banner alert-active";
            } else if ((100 - currentUpProbability) >= 82) {
                alertBanner.textContent = "🎯 TRIGGER: BUY DOWN CONTRACT!";
                alertBanner.className = "alert-banner alert-active";
            } else {
                alertBanner.textContent = "⌛ WINDOW OPEN: WATCHING FOR 82%+";
                alertBanner.className = "alert-banner";
            }
        } else {
            alertBanner.textContent = "⚠️ OUTSIDE TRADING WINDOW";
            alertBanner.className = "alert-banner";
        }
    }

    // Run loops
    setInterval(simulateLiveData, 2000); 
    setInterval(checkSafetyStrategy, 1000);
</script>

</body>
</html>
